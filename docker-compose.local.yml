name: flowchart-toolbox-local

# Day 1 local full-stack baseline. It intentionally uses its own bridge network
# and disposable development data, so it does not depend on the shared infra-net.
# Copy docker-compose.local.env.example to the ignored docker-compose.local.env
# and set its values before starting this stack. Never place local credentials here.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: "${LOCAL_POSTGRES_DB:?Set LOCAL_POSTGRES_DB in docker-compose.local.env}"
      POSTGRES_PASSWORD: "${LOCAL_POSTGRES_PASSWORD:?Set LOCAL_POSTGRES_PASSWORD in docker-compose.local.env}"
      POSTGRES_USER: "${LOCAL_POSTGRES_USER:?Set LOCAL_POSTGRES_USER in docker-compose.local.env}"
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${LOCAL_POSTGRES_PORT:-5432}:5432"
    volumes:
      - local_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - flowchart-local

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    environment:
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${LOCAL_REDIS_PORT:-6379}:6379"
    volumes:
      - local_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - flowchart-local

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${LOCAL_MINIO_ROOT_USER:?Set LOCAL_MINIO_ROOT_USER in docker-compose.local.env}"
      MINIO_ROOT_PASSWORD: "${LOCAL_MINIO_ROOT_PASSWORD:?Set LOCAL_MINIO_ROOT_PASSWORD in docker-compose.local.env}"
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${LOCAL_MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${LOCAL_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - local_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - flowchart-local

  backend-api:
    build: ./backend
    environment: &backend-environment
      APP__DEBUG: "false"
      APP__HOST: 0.0.0.0
      APP__JSON_CAMEL_CASE: "true"
      APP__PORT: 8000
      AUTH__ENABLED: "true"
      DATABASE__AUTO_MIGRATE: "true"
      DATABASE__URL: "postgresql://${LOCAL_POSTGRES_USER:?Set LOCAL_POSTGRES_USER in docker-compose.local.env}:${LOCAL_POSTGRES_PASSWORD:?Set LOCAL_POSTGRES_PASSWORD in docker-compose.local.env}@postgres:5432/${LOCAL_POSTGRES_DB:?Set LOCAL_POSTGRES_DB in docker-compose.local.env}"
      MINIO__ACCESS_KEY: "${LOCAL_MINIO_ROOT_USER:?Set LOCAL_MINIO_ROOT_USER in docker-compose.local.env}"
      MINIO__ENDPOINT: minio:9000
      MINIO__SECURE: "false"
      MINIO__SECRET_KEY: "${LOCAL_MINIO_ROOT_PASSWORD:?Set LOCAL_MINIO_ROOT_PASSWORD in docker-compose.local.env}"
      REDIS__URL: redis://redis:6379/0
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LOCAL_BACKEND_PORT:-10105}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/public/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      flowchart-local:
        aliases:
          - flowchart-toolbox-server

  celery-worker:
    build: ./backend
    command:
      [
        "uv",
        "run",
        "celery",
        "-A",
        "app.workers.celery_app:celery_app",
        "worker",
        "-l",
        "INFO",
        "--pool=solo",
      ]
    environment: *backend-environment
    depends_on:
      redis:
        condition: service_healthy
      backend-api:
        condition: service_healthy
    networks:
      - flowchart-local

  celery-beat:
    build: ./backend
    command:
      [
        "uv",
        "run",
        "celery",
        "-A",
        "app.workers.celery_app:celery_app",
        "beat",
        "-l",
        "INFO",
      ]
    environment: *backend-environment
    depends_on:
      redis:
        condition: service_healthy
      backend-api:
        condition: service_healthy
    volumes:
      - local_celery_beat_data:/app/.celery
    working_dir: /app/.celery
    networks:
      - flowchart-local

  frontend:
    build: ./frontend
    depends_on:
      backend-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LOCAL_FRONTEND_PORT:-20105}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - flowchart-local

networks:
  flowchart-local:
    driver: bridge

volumes:
  local_celery_beat_data:
  local_minio_data:
  local_postgres_data:
  local_redis_data:
