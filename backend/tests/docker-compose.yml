services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: test_db
      POSTGRES_USER: app
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6389:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
