[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[project]
name = "flowchart-toolbox"
version = "0.1.0"
dependencies = [
    "fastapi>=0.116.1",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "cryptography>=44.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "uvicorn>=0.35.0",
    "loguru>=0.7.0",
    "uuid-utils>=0.10.0",
    "psycopg2-binary>=2.9.0",
    "bcrypt>=5.0.0",
    "redis>=8.0.1",
    "captcha>=0.7.1",
    "httpx>=0.28.1",
]
requires-python = ">=3.12,<3.13"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
